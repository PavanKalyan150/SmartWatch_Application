spring.application.name=smartwatch-leaderboard
logging.level.org.springframework.boot.context.config=DEBUG
logging.level.org.springframework.security=DEBUG
# --- DataSource (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/smartwatch_leaderboard
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.batch.jdbc.initialize-schema=always
# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-activity-consumers}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# --- Security / JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartwatch.leaderboard.dto.kafka

spring.batch.job.enabled=false
logging.file.path=logs/smartwatch-leaderboard.log