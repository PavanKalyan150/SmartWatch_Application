spring.application.name=smartwatch-leaderboard
logging.level.org.springframework.boot.context.config=DEBUG
# --- DataSource (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartwatch_leaderboard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-activity-consumers}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# --- Security / JWT ---
app.jwt.secret=uo1tR2DfzEoEQTAyigHLdh37c0uB7NFyHLqEffWxGVz
app.jwt.expiration-ms=90000

